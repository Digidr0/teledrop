[package]
name = "teledrop"
version = "1.0.0"
description = "Telegram media receiver for Windows 11"
authors = ["TeleDrop contributors"]
license = "MIT"
repository = "https://github.com/Digidr0/teledrop"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
secrecy = "0.10"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
rand = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
